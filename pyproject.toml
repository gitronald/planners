[project]
name = "planners"
version = "0.13.5a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pkgskills>=0.6.0",
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/planners"

[project.scripts]
planners = "planners.cli:app"

[project.entry-points."pkgskills.hosts"]
planners = "planners.host:HOST"

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package, including the bundled skill bodies under prompts/.
packages = ["planners"]
artifacts = ["planners/prompts/**/*.md"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/planners",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17,<0.18",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# Lambda parameters can't be annotated, and these `sort(key=...)` lambdas infer from context.
[tool.pyrefly.errors]
implicit-any-lambda = false

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
markers = ["no_repo: leave the test's temp dir outside any git repository"]

[tool.coverage.run]
source = ["planners"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
