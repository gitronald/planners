[project]
name = "planners"
version = "0.6.1a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "typer",
]
readme = "README.md"
license = "MIT"

[project.urls]
repository = "https://github.com/gitronald/planners"

[project.scripts]
planners = "planners.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the package, including the bundled skill bodies under prompts/.
packages = ["planners"]
artifacts = ["planners/prompts/**/*.md"]

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), guides (docs/), the .claude/ holder, tests, and tooling out of
# the published sdist.
only-include = [
    "/planners",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pre-commit",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-cov",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# Python has no syntax for annotating a lambda parameter, so this check (added
# in pyrefly 1.2.0) cannot be satisfied without rewriting every `sort(key=...)`
# lambda as a named function. The parameter types are contextually inferable
# from the sequence being sorted, so the check buys no safety here.
[tool.pyrefly.errors]
implicit-any-lambda = false

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["planners"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
